<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AutoHedge Console</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6b7280; --line:#e5e7eb; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --line:#2a2e36; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#6ea8fe; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .badge { padding:2px 10px; border-radius:99px; font-size:13px; font-weight:600; border:1px solid currentColor; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  input, textarea { font:inherit; width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); padding:10px; border-radius:8px; max-height:420px; overflow:auto; font-size:13px; }
  tr.run { cursor:pointer; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>AutoHedge Console</h1>

  <section id="login" class="card hidden">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <p><button class="primary" id="signin">Sign in</button> <span id="loginMsg" class="bad"></span></p>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <div class="row">
        <span id="botState" class="badge">…</span>
        <span id="botDetail" class="muted"></span>
        <span style="flex:1"></span>
        <button id="signout">Sign out</button>
      </div>
      <p class="muted" id="advisory">Advisory mode: agents write trade recommendations only. No orders are placed.</p>
    </section>

    <section class="card">
      <div class="row">
        <button class="primary" id="toggle">…</button>
        <button id="runNow">Run now</button>
        <span id="actionMsg" class="muted"></span>
      </div>
      <label for="task">Task prompt</label>
      <textarea id="task" rows="3"></textarea>
      <div class="row">
        <div style="flex:1"><label for="interval">Interval (minutes, min 15)</label><input id="interval" type="number" min="15"></div>
        <div style="flex:1"><label for="maxRuns">Max runs per day</label><input id="maxRuns" type="number" min="1" max="100"></div>
      </div>
      <p><button id="save">Save settings</button></p>
    </section>

    <section class="card">
      <strong>Recent runs</strong> <span class="muted">(click a row for output)</span>
      <table><thead><tr><th>Started</th><th>Trigger</th><th>Status</th><th>Duration</th></tr></thead><tbody id="runs"></tbody></table>
      <pre id="detail" class="hidden"></pre>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Public values: safe in the browser. Access is enforced by row-level security.
  const SUPABASE_URL = "https://paeredzsrygvrhblpobj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_dyaQ_7uUhFnNGieyYTz2Dw_Ra0bNbfr";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const STALE_MS = 10 * 60 * 1000;
  let cfg = null, runs = [], timer = null;

  function msg(el, text, cls) { el.textContent = text; el.className = cls || "muted"; }

  async function refresh() {
    const [c, h, r] = await Promise.all([
      sb.from("bot_config").select("*").eq("id", 1).single(),
      sb.from("bot_heartbeat").select("*").eq("id", 1).maybeSingle(),
      sb.from("bot_runs").select("id,started_at,finished_at,status,trigger,error,output").order("started_at", { ascending: false }).limit(25),
    ]);
    if (c.error) { msg($("actionMsg"), c.error.message, "bad"); return; }
    cfg = c.data; runs = r.data || [];
    const hb = h.data;
    const age = hb ? Date.now() - new Date(hb.last_seen).getTime() : Infinity;
    const badge = $("botState");
    if (!hb || age > STALE_MS) { badge.textContent = "OFFLINE"; badge.className = "badge bad"; }
    else if (hb.state === "running") { badge.textContent = "RUNNING"; badge.className = "badge ok"; }
    else if (cfg.paused) { badge.textContent = "PAUSED"; badge.className = "badge warn"; }
    else { badge.textContent = "ACTIVE"; badge.className = "badge ok"; }
    $("botDetail").textContent = hb ? `last seen ${new Date(hb.last_seen).toLocaleString()} · ${hb.host || ""}` : "never seen";
    $("toggle").textContent = cfg.paused ? "Resume schedule" : "Pause schedule";
    if (document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
      $("task").value = cfg.task; $("interval").value = cfg.interval_minutes; $("maxRuns").value = cfg.max_runs_per_day;
    }
    const tb = $("runs"); tb.textContent = "";
    for (const run of runs) {
      const tr = document.createElement("tr"); tr.className = "run";
      const dur = run.finished_at ? Math.round((new Date(run.finished_at) - new Date(run.started_at)) / 1000) + "s" : "…";
      for (const t of [new Date(run.started_at).toLocaleString(), run.trigger, run.status, dur]) {
        const td = document.createElement("td"); td.textContent = t; tr.appendChild(td);
      }
      tr.onclick = () => { const d = $("detail"); d.classList.remove("hidden"); d.textContent = run.error ? "ERROR: " + run.error : JSON.stringify(run.output, null, 2); };
      tb.appendChild(tr);
    }
  }

  async function show() {
    const { data } = await sb.auth.getSession();
    const on = !!data.session;
    $("login").classList.toggle("hidden", on); $("app").classList.toggle("hidden", !on);
    clearInterval(timer);
    if (on) { refresh(); timer = setInterval(refresh, 15000); }
  }

  $("signin").onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
    msg($("loginMsg"), error ? error.message : "", "bad"); show();
  };
  $("signout").onclick = async () => { await sb.auth.signOut(); show(); };
  $("toggle").onclick = async () => {
    const { error } = await sb.from("bot_config").update({ paused: !cfg.paused, updated_at: new Date().toISOString() }).eq("id", 1);
    msg($("actionMsg"), error ? error.message : "Updated", error ? "bad" : "muted"); refresh();
  };
  $("runNow").onclick = async () => {
    const { error } = await sb.from("bot_commands").insert({ command: "run_now" });
    msg($("actionMsg"), error ? error.message : "Queued; the bot picks it up within ~30s", error ? "bad" : "muted");
  };
  $("save").onclick = async () => {
    const { error } = await sb.from("bot_config").update({
      task: $("task").value, interval_minutes: +$("interval").value, max_runs_per_day: +$("maxRuns").value, updated_at: new Date().toISOString(),
    }).eq("id", 1);
    msg($("actionMsg"), error ? error.message : "Saved", error ? "bad" : "muted"); refresh();
  };
  show();
</script>
</body>
</html>
